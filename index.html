<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kishore S | Aerospace & Software Engineering</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for the social icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #121212;
            --accent-color: #ff7b00; /* The orange from your reference */
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --box-bg: #1e1e1e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
        }

        /* --- Navigation --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0 4rem 0;
        }

        .logo {
            color: var(--accent-color);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links li a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links li a:hover, .nav-links li a.active {
            color: var(--accent-color);
        }

        .nav-btn {
            background-color: var(--accent-color);
            color: #000;
            padding: 0.6rem 1.5rem;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: opacity 0.3s;
        }

        .nav-btn:hover {
            opacity: 0.9;
        }

        /* --- Hero Section --- */
        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 4rem;
            flex-grow: 1;
        }

        /* Left Column */
        .intro-text p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .intro-text h2 {
            font-size: 1.8rem;
            font-weight: 500;
            margin-bottom: 1rem;
            color: var(--text-muted);
        }

        .intro-text h1 {
            font-size: 4rem;
            color: var(--accent-color);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 2.5rem;
        }

        .social-icons {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .social-icons a {
            color: var(--text-muted);
            font-size: 1.2rem;
            transition: color 0.3s;
        }

        .social-icons a:hover {
            color: var(--accent-color);
        }

        .action-buttons {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #000;
            padding: 0.8rem 2rem;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            border: 2px solid var(--accent-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .btn-primary:hover {
            background-color: transparent;
            color: var(--accent-color);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-muted);
            padding: 0.8rem 2rem;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 500;
            border: 2px solid #333;
            transition: border-color 0.3s, color 0.3s;
        }

        .btn-secondary:hover {
            border-color: var(--text-muted);
            color: var(--text-main);
        }

        /* Stats Box */
        .stats-box {
            background-color: var(--box-bg);
            padding: 1.5rem;
            border-radius: 8px;
            display: inline-flex;
            gap: 3rem;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Adds a subtle divider line between stats */
        .stat-item:not(:last-child)::after {
            content: '';
            position: absolute;
            right: -1.5rem;
            top: 10%;
            height: 80%;
            width: 1px;
            background-color: #333;
        }

        .stat-number {
            color: var(--accent-color);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Right Column / Image Area */
        .image-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 600px;
        }

        /* The dark circle behind the person */
        .circle-backdrop {
            position: absolute;
            width: 514px;
            height: 616px;
            background-color: #1a1a1a;
            border-radius: 50%;
            z-index: 1;
        }

        /* Your actual image */
        .profile-pic {
            position: relative;
            z-index: 2;
            width: 245%;
            max-width: 640px;
            object-fit: cover;
            object-position: top;
            /* In a real scenario with a transparent PNG, it will sit perfectly over the circle */
        }
        
        @media (max-width: 968px) {
            .hero {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .stats-box {
                justify-content: center;
            }
            .social-icons, .action-buttons {
                justify-content: center;
            }
        }
    </style>
</head>
