<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect | Kishore S</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg-color: #121212; --accent-color: #ff7b00; --text-main: #ffffff; --text-muted: #a0a0a0; --box-bg: #1e1e1e; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1200px; padding: 2rem; display: flex; flex-direction: column; }
        
        nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0 4rem 0; }
        .logo { color: var(--accent-color); font-size: 1.5rem; font-weight: 700; letter-spacing: 1px; }
        .nav-links { display: flex; gap: 2.5rem; list-style: none; }
        .nav-links li a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.3s; }
        .nav-links li a:hover, .nav-links li a.active { color: var(--accent-color); }
        .nav-btn { background-color: var(--accent-color); color: #000; padding: 0.6rem 1.5rem; border-radius: 5px; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: opacity 0.3s; }
        .nav-btn:hover { opacity: 0.9; }

        .page-content { flex-grow: 1; }
        .page-header { text-align: center; margin-bottom: 4rem; }
        .page-title { font-size: 3rem; color: var(--accent-color); font-weight: 700; margin-bottom: 1rem; }
        .page-subtitle { color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto; }
        
        /* Contact Form Styles */
        .contact-form { max-width: 600px; margin: 0 auto; background: var(--box-bg); padding: 3rem; border-radius: 12px; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group input, .input-group textarea { width: 100%; padding: 1rem; background: #121212; border: 1px solid #333; border-radius: 5px; color: #fff; font-family: 'Inter', sans-serif; }
        .input-group input:focus, .input-group textarea:focus { outline: none; border-color: var(--accent-color); }
        .btn-primary { background-color: var(--accent-color); color: #000; padding: 0.8rem 2rem; border-radius: 5px; text-decoration: none; font-weight: 600; border: 2px solid var(--accent-color); transition: background-color 0.3s, color 0.3s; display: inline-block; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 1rem; }
        .btn-primary:hover { background-color: transparent; color: var(--accent-color); }
    </style>
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <nav>
            <div class="logo">KISHORE</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="about.html">About me</a></li>
                <li><a href="teams.html">Teams</a></li>
                <li><a href="contact.html">Contact me</a></li>
            </ul>
            <a href="connect.html" class="nav-btn">Connect</a>
        </nav>

        <!-- Main Content -->
        <main class="page-content">
            <div class="page-header">
                <h1 class="page-title">Send a Message</h1>
                <p class="page-subtitle">Drop your details below and I'll get back to you as soon as possible.</p>
            </div>
            
            <!-- FORM START: Replace the action URL with your Formspree link -->
            <form action="https://formspree.io/f/mnpndjpn" method="POST" class="contact-form">
                <div class="input-group">
                    <input type="text" name="name" placeholder="Your Name" required>
                </div>
                <div class="input-group">
                    <input type="email" name="email" placeholder="Your Email" required>
                </div>
                <div class="input-group">
                    <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
                </div>
                <div style="text-align: center;">
                    <button type="submit" class="btn-primary">Send Message</button>
                </div>
                
                <div style="text-align: center; margin-top: 2.5rem;">
                    <a href="https://github.com/zyrixovath" target="_blank" style="color: var(--accent-color); margin-right: 1.5rem; text-decoration: none; font-weight: 600;">GitHub @zyrixovath</a>
                    <a href="https://linkedin.com/in/kishore773" target="_blank" style="color: var(--accent-color); text-decoration: none; font-weight: 600;">LinkedIn @kishore773</a>
                </div>
            </form>
            <!-- FORM END -->

        </main>
    </div>
</body>
</html>
